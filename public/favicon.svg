<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Fondo: negro de la web con esquinas redondeadas -->
  <rect width="512" height="512" rx="96" fill="#0a0a14"/>

  <!-- Anillo decorativo cian sutil -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#00d4ff" stroke-opacity="0.25" stroke-width="6"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Texto XVII en cian neón -->
  <text x="256" y="256"
        font-family="Consolas, 'JetBrains Mono', Menlo, monospace"
        font-weight="700"
        font-size="150"
        letter-spacing="4"
        text-anchor="middle"
        dominant-baseline="central"
        fill="#00d4ff">XVII</text>

  <!-- Pequeño acento inferior -->
  <rect x="196" y="384" width="120" height="4" rx="2" fill="#00d4ff" fill-opacity="0.6"/>
</svg>
